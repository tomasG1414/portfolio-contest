# Downloads market data (Yahoo Finance, Wikipedia, Nasdaq) on a GitHub runner
# and commits the cache to data/cache, so the analysis can run offline.
name: fetch-market-data
on:
  workflow_dispatch:
    inputs:
      args:
        description: "Extra arguments for `python -m contest --mode fetch`"
        required: false
        default: ""
  push:
    paths: ["data/REFRESH"]
permissions:
  contents: write
concurrency:
  group: fetch-market-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Fetch
        env:
          ARGS: ${{ inputs.args }}
        run: python -m contest --mode fetch $ARGS
      - name: Commit cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/cache
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: refresh market data cache ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
